<!DOCTYPE html>
<html>
<head>
    <title>Fake News Detector</title>
</head>
<body>
    <h2>Fake News Detection</h2>

    <form method="POST">
        <textarea name="news" rows="5" cols="50" placeholder="Enter news text..."></textarea><br><br>
        <button type="submit">Predict</button>
    </form>

    {% if prediction %}
        <h3>Result: {{ prediction }}</h3>
        <p>Confidence: {{ confidence }}%</p>
    {% endif %}
</body>
</html>
